<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HD Water Tank - Final Version</title>
  <style>
    :root { --bg-dark: #121212; --surface-dark: #1e1e1e; --primary-color: #0096ff; --text-light: #e0e0e0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; background: var(--bg-dark); color: var(--text-light); font-family: "Segoe UI", sans-serif; padding: 12px; }
    .top-info { width: 100%; max-width: 1200px; background: rgba(40,40,40,0.6); backdrop-filter: blur(10px); padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 12px; align-items: center; justify-content: space-between; box-shadow: 0 10px 30px rgba(0,0,0,0.25); margin-bottom: 14px; flex-wrap: wrap; }
    .top-left, .top-right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .pill { background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 8px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
    .label { color: var(--primary-color); text-transform: uppercase; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .main { width: 100%; max-width: 1200px; display: flex; gap: 20px; align-items: flex-start; justify-content: center; }
    .tank-section { flex: 0 0 400px; display: flex; flex-direction: column; align-items: center; gap: 15px; position: sticky; top: 15px; }
    .glass-tank { width: 90%; height: 500px; margin: 0 auto; border-radius: 30px 30px 20px 20px; border: 8px solid #333; border-bottom-width: 12px; background: linear-gradient(180deg, #2a2a2a, #1a1a1a); box-shadow: inset 0 6px 15px rgba(0,0,0,0.4), 0 25px 50px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
    .glass-tank::before { content: ''; position: absolute; top: 12%; left: 0; right: 0; height: 12px; background: linear-gradient(180deg, rgba(0,0,0,0.4), rgba(255,255,255,0.08), rgba(0,0,0,0.4)); border-top: 2px solid #444; border-bottom: 2px solid #444; }

    .water { position: absolute; left: 0; bottom: 0; width: 100%; height: var(--water-level, 0%); background: linear-gradient(180deg, #00bfff, #005f9e); transition: height 1.2s cubic-bezier(.2,.9,.2,1); box-shadow: inset 0 -10px 40px rgba(0,0,0,0.5); }
    .water::before, .water::after { content: none; }
    
    .particle-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; }
    .particle { position: absolute; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bubble { border-radius: 50%; background: #28a745; animation-name: rise; }
    .drop { width: 4px; height: 10px; background: #e74c3c; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; animation-name: fall; }
    @keyframes rise { from { transform: translateY(0); opacity: 0.7; } to { transform: translateY(-480px); opacity: 0; } }
    @keyframes fall { from { transform: translateY(0); opacity: 1; } to { transform: translateY(480px); opacity: 0; } }
    
    .internal-percentage { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 38px; font-weight: 700; z-index: 10; min-width: 140px; text-align: center; border: 1px solid rgba(255,255,255,0.2); text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 18px var(--primary-color), 0 0 25px var(--primary-color); }
    .last-time { position: absolute; top: 95px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.45); color: #ffea70; padding: 8px 14px; border-radius: 8px; font-size: 15px; font-weight: 700; z-index: 10; }
    .motor-status { font-family: monospace; padding: 14px 20px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); font-size: 16px; font-weight: 700; text-align: center; width: 220px; transition: all 0.4s ease; border: 2px solid transparent; }
    .motor-on { color: #00ff00; background: #053805; border-color: #00ff00; animation: motorPulse 1.5s infinite; }
    .motor-off { color: #ff4d4d; background: #330a0a; border-color: #ff4d4d; }
    .motor-checking { color: #ffaa00; background: #392800; border-color: #ffaa00; }
    @keyframes motorPulse { 0%, 100% { box-shadow: 0 0 12px #00ff0066; } 50% { box-shadow: 0 0 24px #00ff00cc; } }
    
    .daily-report { flex: 1; background: var(--surface-dark); border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,0.2); overflow: hidden; min-height: 520px; }
    .daily-report h3 { margin: 0; padding: 14px 18px; background: linear-gradient(90deg, #005a99, #003a66); color: #fff; font-size: 18px; font-weight: 700; }
    .report-content { padding: 8px; max-height: 520px; overflow-y: auto; }
    .report-section-title { font-size: 16px; font-weight: 700; color: var(--primary-color); padding: 10px 8px; margin-top: 10px; border-bottom: 2px solid var(--primary-color); }
    details.activity-period { margin: 8px; border-radius: 0 8px 8px 0; transition: background-color 0.3s; }
    details.increase-period { background: rgba(39,174,96,0.1); border-left: 4px solid #27ae60; }
    details.decrease-period { background: rgba(192,57,43,0.1); border-left: 4px solid #c0392b; }
    details summary { font-weight: 700; font-size: 16px; padding: 12px 16px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    details.increase-period summary { color: #2ecc71; }
    details.decrease-period summary { color: #e74c3c; }
    details summary::-webkit-details-marker { display: none; }
    details summary::after { content: '+'; font-size: 24px; font-weight: 400; transition: transform 0.3s ease-in-out; }
    details[open] summary::after { transform: rotate(45deg); }
    .period-content { padding: 0 16px 12px 16px; }
    .water-level-info { background: rgba(0,0,0,0.2); border: 1px solid #444; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; color: #ccc; }
    .level-change { font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
    .level-increase { background: #144824; color: #a3ffc3; }
    .level-decrease { background: #5c1c20; color: #ffb8bd; }
    .period-stats { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
    .stat-item { background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; color: #bbb; }
    .loading-msg, .no-entries-msg { text-align: center; padding: 20px; color: #888; font-style: italic; }
    @media (max-width: 900px) { .main { flex-direction: column; align-items: center; } .tank-section { flex: none; width: 90vw; max-width: 400px; position: static; } .daily-report { width: 100%; margin-top: 20px; } }
  </style>
</head>
<body>

  <div class="top-info">
    <div class="top-left">
      <div class="pill"><span class="label">Channel</span> <span id="chId"></span></div>
      <div class="pill"><span class="label">Entries</span> <span id="todayTotal">0</span></div>
    </div>
    <div class="top-right">
      <div class="pill"><span class="label">Day Start</span> <span id="dayStartTime">--:--</span></div>
      <div class="pill"><span class="label">Last Update</span> <span id="lastUpdateTime">--:--</span></div>
    </div>
  </div>
  
  <div class="main">
    <div class="tank-section">
      <div class="glass-tank" role="img" aria-label="Water Tank">
        <div class="water" id="waterFill" style="--water-level:0%"></div>
        <div class="particle-container" id="particleContainer"></div>
        <div class="internal-percentage" id="internalPercentage">0%</div>
        <div class="last-time" id="lastTime">--:--:--</div>
      </div>
      <div id="motorStatus" class="motor-status motor-checking">CHECKING MOTOR...</div>
    </div>
    <div class="daily-report">
      <h3>ਅੱਜ ਦੀ ਰਿਪੋਰਟ</h3>
      <div class="report-content" id="reportContent">
        <div class="loading-msg">ਡੇਟਾ ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ...</div>
      </div>
    </div>
  </div>

  <script>
    const channelId = "2949851";
    const readApiKey = "";
    document.getElementById('chId').textContent = channelId;

    let previousWaterLevel = null;
    let motorTrendHistory = [];
    const TREND_HISTORY_LENGTH = 3;
    const MOTOR_SENSITIVITY = 0.3;

    function createParticle(type) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.classList.add(type === 'increasing' ? 'bubble' : 'drop');
        const size = Math.random() * 10 + 5;
        if (type === 'increasing') {
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.bottom = '-20px';
        }
        particle.style.left = `${Math.random() * 90 + 5}%`;
        particle.style.animationDuration = `${Math.random() * 3 + 4}s`;
        particle.style.animationDelay = `${Math.random() * 4}s`;
        return particle;
    }

    function updateParticles(trend) {
        const container = document.getElementById('particleContainer');
        if (container.dataset.trend === trend) return;
        container.innerHTML = '';
        container.dataset.trend = trend;
        if (trend === 'increasing' || trend === 'decreasing') {
            const particleCount = 15;
            for (let i = 0; i < particleCount; i++) {
                container.appendChild(createParticle(trend));
            }
        }
    }
    
    function updateDynamicStatus(currentLevel) {
        const motorStatusEl = document.getElementById('motorStatus');
        if (previousWaterLevel === null) { previousWaterLevel = currentLevel; return; }
        const levelChange = currentLevel - previousWaterLevel;
        let currentTrend = 0;
        if (levelChange > MOTOR_SENSITIVITY) currentTrend = 1; else if (levelChange < -MOTOR_SENSITIVITY) currentTrend = -1;
        motorTrendHistory.push(currentTrend);
        if (motorTrendHistory.length > TREND_HISTORY_LENGTH) motorTrendHistory.shift();
        const isConsistentlyIncreasing = motorTrendHistory.every(trend => trend === 1);
        
        if (isConsistentlyIncreasing) {
            motorStatusEl.textContent = "MOTOR ON";
            motorStatusEl.className = "motor-status motor-on";
            updateParticles('increasing');
        } else {
            motorStatusEl.textContent = "MOTOR OFF";
            motorStatusEl.className = "motor-status motor-off";
            const isConsistentlyDecreasing = motorTrendHistory.every(trend => trend === -1);
            updateParticles(isConsistentlyDecreasing ? 'decreasing' : 'none');
        }
        previousWaterLevel = currentLevel;
    }

    function getWaterGradient(level) { if (level >= 90) return "linear-gradient(180deg,#8a2be2,#4b0082,#0000ff,#00bfff,#00ff7f,#ffd700,#ff4500)"; if (level >= 75) return "linear-gradient(180deg,#4b0082,#0000ff,#00bfff,#00ff7f,#ffd700)"; if (level >= 60) return "linear-gradient(180deg,#0000ff,#00bfff,#00ff7f,#ffd700)"; if (level >= 45) return "linear-gradient(180deg,#00bfff,#00ff7f,#ffd700,#ff8c00)"; if (level >= 30) return "linear-gradient(180deg,#00ff7f,#ffd700,#ff8c00,#ff4500)"; if (level >= 15) return "linear-gradient(180deg,#ffd700,#ff8c00,#ff4500)"; return "linear-gradient(180deg,#ff4500,#8b0000)"; }
    function calculateWaterLevel(field1Value) { const empty = parseFloat(field1Value); return Math.max(0, Math.min(100, 100 - (isNaN(empty) ? 0 : empty))); }
    function analyzeDailyActivity(feeds) { if (!feeds || feeds.length === 0) return null; const feedsWithLevels = feeds.map(feed => ({ ...feed, waterLevel: calculateWaterLevel(feed.field1) })).sort((a, b) => new Date(a.created_at) - new Date(b.created_at)); const activityPeriods = []; let currentPeriod = null; const GAP_THRESHOLD = 10 * 60 * 1000; feedsWithLevels.forEach((feed) => { const feedTime = new Date(feed.created_at); if (!currentPeriod) { currentPeriod = { startTime: feedTime, endTime: feedTime, count: 1, startLevel: feed.waterLevel, endLevel: feed.waterLevel, minLevel: feed.waterLevel, maxLevel: feed.waterLevel }; } else { if ((feedTime - currentPeriod.endTime) <= GAP_THRESHOLD) { currentPeriod.endTime = feedTime; currentPeriod.count++; currentPeriod.endLevel = feed.waterLevel; currentPeriod.minLevel = Math.min(currentPeriod.minLevel, feed.waterLevel); currentPeriod.maxLevel = Math.max(currentPeriod.maxLevel, feed.waterLevel); } else { activityPeriods.push(currentPeriod); currentPeriod = { startTime: feedTime, endTime: feedTime, count: 1, startLevel: feed.waterLevel, endLevel: feed.waterLevel, minLevel: feed.waterLevel, maxLevel: feed.waterLevel }; } } }); if (currentPeriod) activityPeriods.push(currentPeriod); return { totalEntries: feeds.length, periods: activityPeriods }; }
    function formatTime(dateStr) { return new Date(dateStr).toLocaleTimeString("en-US", { hour: "numeric", minute: "numeric", hour12: !0 }); }
    
    function generateDailyReport(activityData) {
        const reportContent = document.getElementById("reportContent");
        if (!activityData || activityData.periods.length === 0) { reportContent.innerHTML = '<div class="no-entries-msg">ਅੱਜ ਕੋਈ ਗਤੀਵਿਧੀ ਦਰਜ ਨਹੀਂ ਹੋਈ।</div>'; return; }
        let html = '';
        const increasingPeriods = activityData.periods.filter(p => p.endLevel - p.startLevel > MOTOR_SENSITIVITY);
        const decreasingPeriods = activityData.periods.filter(p => p.startLevel - p.endLevel > MOTOR_SENSITIVITY);
        html += '<div class="report-section-title">ਪਾਣੀ ਭਰਨ ਦੇ ਪੀਰੀਅਡ (Filling)</div>';
        if (increasingPeriods.length > 0) {
            increasingPeriods.forEach((p, i) => { html += createPeriodHtml(p, "increase-period", i === 0) });
        } else {
            html += '<div class="no-entries-msg">ਅੱਜ ਪਾਣੀ ਭਰਨ ਦੀ ਕੋਈ ਐਂਟਰੀ ਨਹੀਂ ਮਿਲੀ।</div>';
        }
        html += '<div class="report-section-title">ਪਾਣੀ ਦੀ ਵਰਤੋਂ ਦੇ ਪੀਰੀਅਡ (Usage)</div>';
        if (decreasingPeriods.length > 0) {
            decreasingPeriods.forEach((p, i) => { html += createPeriodHtml(p, "decrease-period", i === 0) });
        } else {
            html += '<div class="no-entries-msg">ਅੱਜ ਪਾਣੀ ਦੀ ਵਰਤੋਂ ਦੀ ਕੋਈ ਐਂਟਰੀ ਨਹੀਂ ਮਿਲੀ।</div>';
        }
        reportContent.innerHTML = html;
    }

    function createPeriodHtml(period, typeClass, isOpen) {
        const duration = (new Date(period.endTime) - new Date(period.startTime)) / 1000;
        const durationText = duration > 60 ? `${Math.floor(duration/60)}m ${Math.round(duration%60)}s` : `${Math.round(duration)}s`;
        const levelChangeText = `${(period.endLevel - period.startLevel) > 0 ? '+':''}${(period.endLevel - period.startLevel).toFixed(1)}%`;
        const levelChangeClass = (period.endLevel - period.startLevel) > 0 ? 'level-increase' : 'level-decrease';

        return `
          <details class="activity-period ${typeClass}" ${isOpen ? "open" : ""}>
            <summary>${formatTime(period.startTime)} - ${formatTime(period.endTime)}</summary>
            <div class="period-content">
              <div class="water-level-info">
                <strong>ਪੱਧਰ:</strong> ${period.startLevel.toFixed(1)}% → ${period.endLevel.toFixed(1)}%
                <span class="level-change ${levelChangeClass}">${levelChangeText}</span>
              </div>
              <div class="period-stats">
                <div class="stat-item">ਐਂਟਰੀਆਂ: ${period.count}</div><div class="stat-item">ਮਿਆਦ: ${durationText}</div>
              </div>
            </div>
          </details>`;
    }
    
    async function fetchData() {
        const url = `https://api.thingspeak.com/channels/${channelId}/feeds.json?api_key=${readApiKey}&results=8000`;
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Network error`);
            const data = await response.json();
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const todaysFeeds = data.feeds.filter(feed => new Date(feed.created_at) >= today);
            
            if (todaysFeeds.length > 0) {
                const lastFeed = todaysFeeds[todaysFeeds.length - 1];
                const firstFeed = todaysFeeds[0];
                const waterLevel = calculateWaterLevel(lastFeed.field1);
                
                document.getElementById("waterFill").style.setProperty("--water-level", `${waterLevel}%`);
                document.getElementById("internalPercentage").textContent = `${waterLevel.toFixed(1)}%`;
                document.getElementById("lastTime").textContent = formatTime(lastFeed.created_at);

                document.getElementById("todayTotal").textContent = todaysFeeds.length;
                document.getElementById("dayStartTime").textContent = formatTime(firstFeed.created_at);
                document.getElementById("lastUpdateTime").textContent = formatTime(lastFeed.created_at);

                updateDynamicStatus(waterLevel);
                const activityData = analyzeDailyActivity(todaysFeeds);
                generateDailyReport(activityData);

            } else {
                document.getElementById("reportContent").innerHTML = '<div class="loading-msg">ਅੱਜ ਕੋਈ ਡੇਟਾ ਨਹੀਂ ਮਿਲਿਆ।</div>';
                document.getElementById("motorStatus").textContent = "NO DATA";
                document.getElementById("motorStatus").className = "motor-status motor-off";
            }
        } catch (error) {
            console.error("Fetch Error:", error);
            document.getElementById("reportContent").innerHTML = '<div class="loading-msg">ਡੇਟਾ ਲੋਡ ਕਰਨ ਵਿੱਚ ਤਰੁੱਟੀ ਆਈ।</div>';
        }
    }
    
    // ਹਰ 15 ਸਕਿੰਟ ਬਾਅਦ ਡਾਟਾ ਨੂੰ ਰਿਫਰੈਸ਼ ਕਰੋ
    fetchData();
    setInterval(fetchData, 15000);
  </script>

</body>
</html>
